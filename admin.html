<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EncontraFácil | Admin</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">

    <!-- Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- HEADER -->
    <header class="app-header sticky-top border-bottom">

        <div class="container d-flex align-items-center justify-content-between h-100 py-2">

            <div class="d-flex align-items-center gap-2">
                <i data-lucide="shield-check" class="text-brand" style="width:24px;height:24px;">
                </i>

                <span class="fs-5 fw-bold brand-text">
                    EncontraFácil | Admin
                </span>
            </div>

            <div class="d-flex align-items-center gap-3">

                <button onclick="toggleDarkMode()" class="btn btn-icon nav-text">

                    <i id="theme-icon" data-lucide="moon">
                    </i>

                </button>

                <button onclick="window.location.href='index.html'"
                    class="btn btn-outline-danger btn-sm d-flex align-items-center gap-2">

                    <i data-lucide="log-out" style="width:16px;"></i>

                    Sair
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="container py-5 flex-grow-1">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="fw-bold title-text">
                Painel de Gestão
            </h2>

            <span class="badge bg-primary">
                Usuário: admin@escola.com
            </span>
        </div>

        <div class="row g-4">

            <!-- COLUNA ESQUERDA -->
            <div class="col-md-4">

                <!-- VIACEP -->
                <div class="card border-0 shadow-sm item-card p-3 mb-4">

                    <h6 class="fw-bold title-text border-bottom pb-2 mb-3">
                        1. Cadastrar Matriz (ViaCEP)
                    </h6>

                    <form onsubmit="simulateSave(event, 'Instituição cadastrada!')">

                        <div class="mb-2">
                            <input type="text" id="cep-input" maxlength="8" onblur="buscarCEP()"
                                class="form-control bg-input border-0" placeholder="Digite o CEP">
                        </div>

                        <div class="mb-2">
                            <input type="text" id="logradouro" readonly class="form-control bg-input border-0"
                                placeholder="Rua">
                        </div>

                        <div class="mb-3">
                            <input type="text" id="bairro" readonly class="form-control bg-input border-0"
                                placeholder="Bairro">
                        </div>

                        <button class="btn btn-brand w-100">
                            Salvar Instituição
                        </button>

                    </form>
                </div>

                <!-- NOVA SEDE -->
                <div class="card border-0 shadow-sm item-card p-3 mb-4">

                    <h6 class="fw-bold title-text border-bottom pb-2 mb-3">
                        2. Nova Sede
                    </h6>

                    <form onsubmit="cadastrarSede(event)">

                        <input type="text" id="nova-sede-nome" required class="form-control bg-input border-0 mb-3"
                            placeholder="Ex: Shopping, Hotel">

                        <button class="btn btn-success w-100">
                            Adicionar Sede
                        </button>

                    </form>
                </div>

                <!-- ADMIN -->
                <div class="card border-0 shadow-sm item-card p-3 mb-4">

                    <h6 class="fw-bold title-text border-bottom pb-2 mb-3">
                        3. Criar Admin Local
                    </h6>

                    <!-- ADMIN -->
                    <div class="card border-0 shadow-sm item-card p-3 mb-4">

                        <form onsubmit="simulateSave(event, 'Usuário criado!')">

                            <input type="text" required class="form-control bg-input border-0 mb-2" placeholder="Nome">

                            <input type="email" required class="form-control bg-input border-0 mb-2"
                                placeholder="Email">

                            <select required class="form-select bg-input border-0 mb-2 dynamic-location-select">

                                <option value="">
                                    Selecionar Sede
                                </option>

                            </select>

                            <!-- SENHA -->
                            <div class="input-group mb-3">

                                <input type="text" id="senha-admin" readonly class="form-control bg-input border-0"
                                    placeholder="Senha do usuário">

                                <button type="button" onclick="gerarSenhaAdmin()" class="btn btn-primary">

                                    Gerar
                                </button>

                            </div>

                            <button class="btn btn-dark w-100">
                                Criar Usuário
                            </button>

                        </form>
                    </div>
                </div>
            </div>

            <!-- COLUNA DIREITA -->
            <div class="col-md-8">

                <!-- CADASTRO ITEM -->
                <div class="card border-0 shadow-sm item-card p-4 mb-4">

                    <h5 class="fw-bold title-text mb-4">
                        Registrar Novo Item Perdido
                    </h5>

                    <form onsubmit="cadastrarItem(event)">

                        <div class="row g-3">

                            <div class="col-md-6">
                                <input type="text" id="novo-item-titulo" required class="form-control bg-input border-0"
                                    placeholder="Nome do item">
                            </div>

                            <div class="col-md-6">
                                <select required id="novo-item-local"
                                    class="form-select bg-input border-0 dynamic-location-select">

                                    <option value="">
                                        Selecione Local
                                    </option>

                                </select>
                            </div>

                            <div class="col-md-6">
                                <input type="text" id="novo-item-desc" required class="form-control bg-input border-0"
                                    placeholder="Descrição">
                            </div>

                            <div class="col-md-6">
                                <input type="file" id="novo-item-img" required accept="image/*"
                                    class="form-control bg-input border-0">
                            </div>
                        </div>

                        <div class="text-end mt-4">

                            <button class="btn btn-primary px-4 fw-bold">
                                Publicar
                            </button>

                        </div>
                    </form>
                </div>

                <!-- DATATABLE -->
                <div class="card border-0 shadow-sm item-card p-4">

                    <h5 class="fw-bold title-text mb-3">
                        Gerenciar Itens
                    </h5>

                    <div class="table-responsive">

                        <table id="tabelaItens" class="table table-hover align-middle w-100">

                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Item</th>
                                    <th>Local</th>
                                    <th>Data</th>
                                    <th>Status</th>
                                    <th>Ação</th>
                                </tr>
                            </thead>

                            <tbody></tbody>

                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- SCRIPTS -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

    <script src="api.js"></script>
    <script src="script.js"></script>

</body>

</html>
